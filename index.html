<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Page</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        .auth-container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .error { color: red; font-size: 0.8rem; margin-top: 0.25rem; display: none; }
        button { width: 100%; padding: 0.75rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; margin-top: 1rem; }
        button:hover { background-color: #0056b3; }
        .toggle-link { text-align: center; margin-top: 1rem; font-size: 0.9rem; color: #007bff; cursor: pointer; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2 id="form-title">Login</h2>
    <form id="auth-form">
        <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" required placeholder="you@example.com">
            <div id="email-error" class="error">Invalid email format.</div>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required>
            <div id="password-error" class="error">Must contain 8+ chars, 1 uppercase, 1 lowercase, 1 number, and 1 special character.</div>
        </div>
        <button type="submit" id="submit-btn">Login</button>
    </form>
    <div class="toggle-link" id="toggle-mode">Need an account? Register here</div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
